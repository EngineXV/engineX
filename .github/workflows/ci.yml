name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --project core --group dev
      - run: uv run --project core ruff check core/ tools/
      - run: uv run --project core ruff format --check core/ tools/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: cd core && uv run python -m pytest tests/ -q --cov=engine --cov-report=term-missing --cov-fail-under=50
      - run: cd tools && uv run python -m pytest tests/ -q

  validate:
    name: Validate example agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: chmod +x engine && ./engine validate examples/templates/agreement_analysis
